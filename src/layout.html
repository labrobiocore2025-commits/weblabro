<!DOCTYPE html>
<html lang="uk" class="{{ html_class }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- GitHub Pages cannot set response headers, so CSP comes from <meta>. No inline scripts/styles/handlers anywhere. -->
<meta http-equiv="Content-Security-Policy" content="{{{ csp }}}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="labro-api" content="{{ api }}">
<meta name="theme-color" content="#060A08">
{{{ head_meta }}}
<link rel="icon" href="{{ base }}favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ base }}favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ base }}favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base }}favicon-180.png">
<link rel="manifest" href="{{ base }}site.webmanifest">
<link rel="preload" href="{{ base }}assets/fonts/geologica.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ base }}assets/site.css">
<noscript><link rel="stylesheet" href="{{ base }}assets/noscript.css"></noscript>
{{{ ld_json }}}
{{{ scripts_html }}}
</head>
<body data-price-kop="99000" data-page="{{ nav }}">
<a class="skip-link" href="#main">Перейти до змісту</a>
<!-- the fixed header sits outside .g-4 (z-index 2 stacking context) so its menu button stays above the open menu -->
{{> header }}
<div class="g-1">
<div class="g-2"></div>
<div class="g-3"></div>
<div class="g-4">
<main id="main">
{{{ content }}}
</main>
{{> footer }}
</div>
{{> bar if has_bar }}
</div>
{{> menu }}
{{> modal if has_modal }}
{{> curtain }}
<div class="ft-95" aria-hidden="true" data-cursor></div>
</body>
</html>
