name: Validate site

# GitHub Pages serves this repo straight from main (Settings → Pages → Deploy from branch).
# This check is required by branch protection, so nothing broken reaches main via a PR.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # html-validate 11 requires Node >= 22
      - name: HTML (rules in .htmlvalidate.json)
        run: npx --yes html-validate@11 *.html
      - name: Strict CSP — no inline scripts, styles or handlers
        run: |
          if grep -nE "<script>|<script [^>]*>[^<]+</script>|<style|\son[a-z]+=\"|style=\"|'unsafe-inline'|'unsafe-eval'" *.html; then
            echo "::error::Inline script/style/handler or unsafe CSP keyword found"; exit 1
          fi
      - name: Pages that call the API allow exactly that origin in CSP
        run: |
          for f in $(grep -l 'name="labro-api"' *.html); do
            api=$(grep -ho 'name="labro-api" content="[^"]*"' "$f" | cut -d'"' -f4)
            grep -q "connect-src $api;" "$f" || { echo "::error file=$f::CSP connect-src does not match labro-api ($api)"; exit 1; }
          done
      - name: Asset cache-busting versions are current
        run: python3 tools/stamp-assets.py --check
      - name: Custom domain file present
        run: test "$(cat CNAME)" = "labrobiocore.com.ua"
      - name: No secrets in client code
        run: |
          if grep -rnE "X-Token|MONO_TOKEN|[0-9]{8,10}:[A-Za-z0-9_-]{35}|ghp_[A-Za-z0-9]{30,}" --include=*.html --include=*.js .; then
            echo "::error::Secret-looking value found in client-side code"; exit 1
          fi
      - name: Unfilled legal placeholders (warning)
        run: |
          if grep -n "data-todo" privacy.html; then
            echo "::warning file=privacy.html::Owner details in the privacy policy are not filled in yet"
          fi
