name: Validate site

# GitHub Pages serves this repo straight from main (Settings → Pages → Deploy from branch).
# This check is required by branch protection, so nothing broken reaches main via a PR.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # html-validate 11 requires Node >= 22
      - name: Pages are built from src/ (tools/build.py) and asset versions are current
        run: python3 tools/build.py --check
      - name: HTML (rules in .htmlvalidate.json)
        run: npx --yes html-validate@11 *.html blog/*.html
      - name: Strict CSP — no inline scripts, styles or handlers (JSON-LD data blocks are not scripts)
        run: |
          if grep -nE "<script>|<script [^>]*>[^<]+</script>|<style|\son[a-z]+=\"|style=\"|'unsafe-inline'|'unsafe-eval'" *.html blog/*.html \
             | grep -v '<script type="application/ld+json">'; then
            echo "::error::Inline script/style/handler or unsafe CSP keyword found"; exit 1
          fi
      - name: Pages that call the API allow exactly that origin in CSP
        run: |
          for f in $(grep -l 'name="labro-api"' *.html blog/*.html); do
            api=$(grep -ho 'name="labro-api" content="[^"]*"' "$f" | cut -d'"' -f4)
            grep -qE "connect-src $api[ ;]" "$f" || { echo "::error file=$f::CSP connect-src does not match labro-api ($api)"; exit 1; }
          done
      - name: Third-party scripts only from the exact Meta Pixel host, no wildcards
        run: |
          if grep -ohE "script-src [^;]*" *.html blog/*.html | grep -vxE "script-src 'self'( https://connect\.facebook\.net)?"; then
            echo "::error::Unexpected script-src source"; exit 1
          fi
          if grep -nE 'Content-Security-Policy" content="[^"]*\*' *.html blog/*.html; then
            echo "::error::Wildcard in CSP"; exit 1
          fi
      - name: Meta Pixel only through the consent-gated loader
        run: |
          if grep -rnE "fbevents\.js|facebook\.com/tr" --include=*.html --include=*.js . | grep -v "^./assets/js/meta-pixel.js:"; then
            echo "::error::Meta Pixel loaded outside assets/js/meta-pixel.js (consent bypass)"; exit 1
          fi
      - name: Custom domain file present
        run: test "$(cat CNAME)" = "labrobiocore.com.ua"
      - name: No secrets in client code
        run: |
          if grep -rnE "X-Token|MONO_TOKEN|[0-9]{8,10}:[A-Za-z0-9_-]{35}|ghp_[A-Za-z0-9]{30,}" --include=*.html --include=*.js .; then
            echo "::error::Secret-looking value found in client-side code"; exit 1
          fi
      - name: Unfilled legal placeholders (warning)
        run: |
          if grep -n "data-todo" privacy.html; then
            echo "::warning file=privacy.html::Owner details in the privacy policy are not filled in yet"
          fi
      - name: Customer content placeholders still on pages (warning)
        run: |
          n=$(grep -o "data-ph" *.html blog/*.html | wc -l)
          if [ "$n" -gt 0 ]; then echo "::warning::$n customer-content placeholders ([… — від замовника]) are still on the site"; fi

  # Performance budget (mobile emulation, Slow 4G + 4x CPU, median of 3): below the thresholds = red CI.
  # Thresholds and pages: lighthouserc.json. The API is not reachable from the runner's localhost origin (CORS),
  # which is why Best Practices (console errors) is not asserted here — it is checked on the preview / production.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lighthouse CI (budgets in lighthouserc.json)
        run: npx --yes @lhci/cli@0.14.0 autorun
